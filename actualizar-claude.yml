name: Actualizar tablero Claude DEEP
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # 03:00 Argentina, todos los dias
permissions:
  contents: write
concurrency:
  group: tablero-claude-deep
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r claude/requirements.txt
      - name: Ejecutar agente real de Claude
        working-directory: claude
        run: python agente.py --dias 5 --sin-avisos
      - name: Comprobar tablero generado
        run: |
          test -s claude/salida/tablero.html
          grep -q 'Tablero de licitaciones' claude/salida/tablero.html
      - name: Publicar tablero y conservar historial
        run: |
          cp claude/salida/tablero.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html claude/salida/licitaciones.db
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar tablero Claude DEEP"
            git push
          fi
