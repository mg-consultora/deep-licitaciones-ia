
name: Publicar tablero DEEP

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener version mas reciente
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos del tablero
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar tablero
        id: deployment
        uses: actions/deploy-pages@v4
