name: Auditoría integral CONTRAT.AR
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar auditoría integral (sin modificar datos)
        run: python3 auditoria_integral.py
      - name: Guardar informe de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-auditoria-contratar
          path: auditoria_contratar_resultado.json
