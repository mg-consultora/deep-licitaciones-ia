name: Actualizar tablero Claude DEEP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # 03:00 Argentina (UTC-3), una vez al día

permissions:
  contents: write
  actions: write

# Comparte el bloqueo con "Obras futuras" para que ambos no escriban
# index.html y salida/obras.db al mismo tiempo.
concurrency:
  group: obras-futuras
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install -r claude/requirements.txt
          python -m pip install requests beautifulsoup4 pyyaml
      - name: Ejecutar agente real de Claude
        working-directory: claude
        run: python agente.py --dias 5 --sin-avisos
      - name: Comprobar tablero generado
        run: |
          test -s claude/salida/tablero.html
          grep -q 'Tablero de licitaciones' claude/salida/tablero.html
      - name: Incorporar obras futuras y filtros al tablero Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cp claude/salida/tablero.html index.html
          python obras.py --html index.html
          python actualizar_base_maestra.py --html index.html
          grep -q 'base-maestra-deep' index.html
          test -s index.html
          grep -q 'o-prioritarias' index.html
          grep -q 'o-pro' index.html
      - name: Publicar tablero completo y conservar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.html claude/salida/licitaciones.db salida/obras.db
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar tablero Claude DEEP con obras y filtros"
            git push origin HEAD:main
          fi
      - name: Solicitar despliegue de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Los pushes con GITHUB_TOKEN no disparan el workflow de Pages.
          # workflow_dispatch sí lo hace; static.yml toma la última main.
          gh workflow run static.yml --ref main
