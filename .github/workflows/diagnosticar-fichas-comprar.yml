name: Diagnosticar fichas dinamicas COMPR.AR
on:
  workflow_dispatch:
  push:
    paths:
      - 'diagnosticar_fichas_comprar.py'
      - 'claude/licitaciones/fuentes/comprar_webforms.py'
      - '.github/workflows/diagnosticar-fichas-comprar.yml'
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 pyyaml
      - run: python -m compileall -q diagnosticar_fichas_comprar.py claude/licitaciones/fuentes/comprar_webforms.py
      - run: python -u diagnosticar_fichas_comprar.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-fichas-comprar
          path: diagnostico_fichas_dinamicas.json
          if-no-files-found: warn
