# Módulo "Obras futuras y oportunidades privadas".
# Corre solo, DESPUÉS de "Actualizar tablero" (no lo modifica), y agrega su pestaña al tablero publicado.
# Funciona con las PC apagadas. También se puede correr a mano: Actions → "Obras futuras" → Run workflow.
name: Obras futuras

on:
  workflow_run:
    workflows: ["Actualizar tablero Claude DEEP"]
    types: [completed]
  schedule:
    - cron: "30 12 * * 1-5"      # respaldo: 9:30 de Argentina, por si el otro flujo tuviera otro nombre
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obras-futuras
  cancel-in-progress: false

jobs:
  obras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Buscar obras y agregar la pestaña al tablero
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # opcional
        run: |
          # El tablero publicado suele estar en docs/index.html; si no, se usa salida/tablero.html.
          if [ -f docs/index.html ]; then HTML=docs/index.html; else HTML=salida/tablero.html; fi
          echo "Tablero: $HTML"
          python obras.py --html "$HTML"

      - name: Guardar tablero y memoria de obras
        run: |
          git config user.name "agente-licitaciones"
          git config user.email "agente-licitaciones@users.noreply.github.com"
          git add -f salida/obras.db
          [ -f docs/index.html ] && git add -f docs/index.html
          [ -f salida/tablero.html ] && git add -f salida/tablero.html
          git diff --cached --quiet && exit 0
          git commit -m "Obras futuras actualizadas $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
