
name: Diagnóstico buscador avanzado CONTRAT.AR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Examinar campos públicos
        run: python diagnostico_busqueda_avanzada.py
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-buscador-avanzado
          path: diagnostico_busqueda_avanzada.json
          if-no-files-found: warn
