
name: Probar acceso al Boletin Oficial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Comprobar acceso desde GitHub
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.error

          url = "https://www.boletinoficial.gob.ar/seccion/tercera/20261019"

          try:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=25) as r:
                  html = r.read().decode("utf-8", errors="replace")
                  print("HTTP:", r.status)
                  print("URL:", r.geturl())
                  print("Bytes:", len(html))
                  print("Contiene licitaciones:", "Licitación" in html or "Licitacion" in html)
                  if r.status != 200 or not ("Licitación" in html or "Licitacion" in html):
                      raise SystemExit("Respuesta no validada")
                  print("PRUEBA SUPERADA")
          except Exception as e:
              print("PRUEBA FALLIDA:", repr(e))
              raise SystemExit(1)
          PY
