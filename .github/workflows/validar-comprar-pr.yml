name: Validar COMPR.AR antes de publicar
on:
  pull_request:
    branches: [main]
    paths:
      - "claude/**"
      - ".github/workflows/validar-comprar-pr.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          python -m pip install -r claude/requirements.txt
          python -m pip install pytest requests beautifulsoup4 pyyaml
      - name: Sintaxis y regresión
        run: |
          python -m compileall -q claude
          cd claude
          python -m pytest -q tests/test_comprar_paginacion_segura.py tests/test_comprar_webforms.py tests/test_extractor_comprar.py tests/test_clasificador_deep.py
      - name: Diagnóstico real COMPR.AR (sin publicar)
        env:
          DEEP_COMPRAR_MAX_PAGINAS: "5"
        run: |
          python validar_comprar_deep.py
      - name: Exigir evidencia real antes de aprobar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("informe_comprar_deep.json").read_text(encoding="utf-8"))
          print("Procesos:", p.get("procesos_unicos"), "Fichas verificadas:", p.get("fichas_verificadas"))
          assert p.get("fichas_verificadas", 0) > 0, "SIN FICHAS OFICIALES VERIFICADAS: no se puede aprobar"
          assert p.get("validacion_de_vigencia_completa") is True, "VIGENCIA SIN CERTIFICAR"
          assert p.get("cobertura_exhaustiva_verificada") is True, "COBERTURA SIN CERTIFICAR"
          PY
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validar-comprar-pr
          path: |
            informe_comprar_deep.json
            diagnostico_comprar.json
          if-no-files-found: ignore
