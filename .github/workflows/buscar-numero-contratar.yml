
name: Buscar número CONTRAT.AR (manual)

on:
  workflow_dispatch:
    inputs:
      numero:
        description: 'Número de proceso, por ejemplo 34-0003-LPU26'
        required: true
        default: '34-0003-LPU26'
        type: string
      modo:
        description: 'Tipo de consulta'
        required: true
        default: 'avanzado'
        type: choice
        options:
          - avanzado
          - diagnostico
          - numero

permissions:
  contents: read

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Obtener archivos del repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar buscador avanzado
        if: ${{ inputs.modo == 'avanzado' }}
        env:
          NUMERO_SOLICITADO: ${{ inputs.numero }}
        run: |
          python buscar_numero_avanzado.py --numero "$NUMERO_SOLICITADO"

      - name: Guardar resultado de búsqueda avanzada
        if: ${{ always() && inputs.modo == 'avanzado' }}
        uses: actions/upload-artifact@v4
        with:
          name: resultado-busqueda-avanzada
          path: resultado_busqueda_avanzada.json
          if-no-files-found: warn
          retention-days: 7

      - name: Diagnosticar buscador avanzado
        if: ${{ inputs.modo == 'diagnostico' }}
        run: |
          python diagnostico_busqueda_avanzada.py

      - name: Guardar diagnóstico
        if: ${{ always() && inputs.modo == 'diagnostico' }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-buscador-avanzado
          path: diagnostico_busqueda_avanzada.json
          if-no-files-found: warn

      - name: Buscar en listados oficiales
        if: ${{ inputs.modo == 'numero' }}
        env:
          NUMERO_SOLICITADO: ${{ inputs.numero }}
          DEEP_ARCHIVO_SALIDA: /tmp/consulta-numero.json
        run: |
          python buscar_licitaciones.py --numero "$NUMERO_SOLICITADO"

      - name: Guardar resultado de listados
        if: ${{ always() && inputs.modo == 'numero' }}
        uses: actions/upload-artifact@v4
        with:
          name: consulta-numero-listados
          path: /tmp/consulta-numero.json
          if-no-files-found: warn
          retention-days: 7
