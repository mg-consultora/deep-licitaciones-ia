name: Actualizar licitaciones DEEP (V3 validada)

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC = 03:00 de Argentina.
    - cron: '0 6 * * *'

permissions:
  contents: write

concurrency:
  group: deep-licitaciones-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Registrar archivo anterior y verificar extractor V3
        run: |
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          p = Path('buscar_licitaciones.py')
          if not p.is_file():
              raise SystemExit('ERROR: falta buscar_licitaciones.py')
          source = p.read_text(encoding='utf-8-sig')
          tree = ast.parse(source, filename=str(p))
          marker = 'DEEP-CONTRATAR-V3-CONTROL-PLAZOS-20261026'
          if marker not in source or not any(isinstance(n, ast.FunctionDef) and n.name == 'main' for n in tree.body):
              raise SystemExit('ERROR: extractor V3 o función main ausente')
          old = Path('licitaciones.json')
          baseline = {'sha256': hashlib.sha256(old.read_bytes()).hexdigest() if old.exists() else None}
          Path('/tmp/deep-baseline.json').write_text(json.dumps(baseline))
          print('EXTRACTOR V3:', marker)
          print('JSON anterior:', 'presente y conservado' if old.exists() else 'ausente')
          PY

      - name: Ejecutar extractor V3
        id: extraer
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u buscar_licitaciones.py

      - name: Validar que el JSON sea nuevo y tenga datos verificados
        id: validar
        if: steps.extraer.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          p = Path('licitaciones.json')
          if not p.is_file():
              raise SystemExit('ERROR: el extractor no generó licitaciones.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          old = json.loads(Path('/tmp/deep-baseline.json').read_text())
          new_hash = hashlib.sha256(p.read_bytes()).hexdigest()
          if old['sha256'] == new_hash:
              raise SystemExit('ERROR: el JSON quedó idéntico al anterior; el extractor no lo actualizó')
          if d.get('versionAgente') != 'DEEP-CONTRATAR-V3-CONTROL-PLAZOS-20261026':
              raise SystemExit('ERROR: el JSON no corresponde a la V3')
          try:
              fecha = datetime.fromisoformat(d['actualizado'].replace('Z', '+00:00'))
              if fecha.tzinfo is None:
                  raise ValueError('fecha sin zona horaria')
          except (KeyError, ValueError, TypeError) as exc:
              raise SystemExit('ERROR: fecha de actualización inválida: ' + str(exc))
          if abs(datetime.now(timezone.utc) - fecha.astimezone(timezone.utc)) > timedelta(minutes=35):
              raise SystemExit('ERROR: fecha del JSON no corresponde a esta ejecución')
          rows = d.get('licitaciones')
          print('VERSION:', d['versionAgente'])
          print('FECHA:', d['actualizado'])
          print('ESTADO:', d.get('estado'))
          print('EXTRACCION_COMPLETA:', d.get('extraccionCompleta'))
          print('REGISTROS:', len(rows) if isinstance(rows, list) else 'inválido')
          for fuente in d.get('fuentes', []):
              print('FUENTE:', fuente.get('nombre'), '| ESTADO:', fuente.get('estado'), '| ERRORES:', fuente.get('errores', []))
          if d.get('extraccionCompleta') is not True:
              raise SystemExit('ERROR: extracción incompleta; se conserva la publicación anterior')
