
name: Actualizar licitaciones DEEP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-licitaciones
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar programa
        run: python buscar_licitaciones.py

      - name: Validar archivo generado
        run: python -m json.tool licitaciones.json > /dev/null

      - name: Publicar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add licitaciones.json

          if git diff --cached --quiet; then
            echo "Sin cambios en los resultados."
          else
            git commit -m "Actualizar datos de licitaciones DEEP"
            git push
          fi
