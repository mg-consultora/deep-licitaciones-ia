
name: Actualizar licitaciones DEEP

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar programa
        run: python buscar_licitaciones.py

      - name: Guardar archivo de resultados
        uses: actions/upload-artifact@v4
        with:
          name: resultados-licitaciones
          path: licitaciones.json
          if-no-files-found: error
